<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#120b18">
  <title>MoMaJohnPlus｜台灣夜市摸麻將</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="mode-select" class="mode-select">
    <div class="mode-select-card"><p>TAIWAN NIGHT MARKET</p><h1>夜市摸麻將</h1>
      <label class="player-name-field" for="player-name-input"><span>玩家名稱</span><input id="player-name-input" type="text" maxlength="12" autocomplete="nickname" placeholder="請輸入名稱"></label>
      <p id="player-name-error" class="player-name-error" role="alert" aria-live="polite"></p>
      <h2>今晚想怎麼玩？</h2>
      <div class="mode-options">
        <button type="button" data-mode="standard"><b>標準模式</b><span>夜市經典玩法・每局 15 張</span><small>事件牌、隨機事件，高風險高變化</small></button>
        <button type="button" data-mode="carnival"><b>狂歡模式 🔥</b><span>純粹拚點・每局 18 張</span><small>沒有隨機事件，多摸三張，專注連線與牌型</small></button>
      </div>
    </div>
  </section>
  <main id="game-shell" class="game-shell hidden">
    <header class="game-hud" aria-label="遊戲資訊">
      <section class="hud-score-panel">
        <div class="hud-left">
          <div class="hud-player"><strong id="player-display">玩家</strong></div>
          <div class="hud-points">
            <div class="hud-total" aria-label="總點數"><strong id="total-score">0</strong></div>
            <div class="hud-round-points" aria-label="本局點數"><strong id="round-score" class="hud-score-gold">0</strong></div>
          </div>
        </div>
        <div class="hud-rounds"><small>局數</small><strong id="rounds-display">1/6</strong></div>
      </section>
    </header>

    <section class="play-area">
      <div id="board" class="board" role="grid" aria-label="六乘六麻將對獎盤"></div>
      <p id="message" class="message" aria-live="polite"></p>
      <section class="draw-zone" aria-label="摸牌操作">
        <button id="leverage-button" class="leverage-button" type="button">下注</button>
        <button id="draw-stack" class="draw-button" type="button">摸牌 (15)</button>
      </section>
      <nav class="game-actions" aria-label="遊戲功能">
        <button id="help-button" class="guide-button" type="button">說明</button>
        <button id="main-menu-button" class="menu-button" type="button">回主選單</button>
      </nav>
    </section>
  </main>

  <div id="final-waiting-overlay" class="final-waiting-overlay" aria-hidden="true">
    <div class="final-waiting-card" role="status" aria-live="assertive">
      <p>FINAL WAITING</p>
      <h2 id="final-waiting-title">聽牌！</h2>
      <div id="final-waiting-missing" class="final-waiting-missing"></div>
    </div>
  </div>

  <div id="bonus-modal" class="bonus-modal" aria-hidden="true"><div class="bonus-card" role="dialog" aria-modal="true" aria-labelledby="bonus-title">
    <p class="modal-kicker">BONUS DRAW</p><h2 id="bonus-title">補牌機會！</h2>
    <section class="waiting-panel"><b>目前聽牌</b><div id="bonus-waiting" class="bonus-waiting"></div></section>
    <div class="bonus-instruction"><span id="bonus-instruction">請選擇 3 張</span><strong id="bonus-count">已選 0 / 3</strong></div>
    <div id="bonus-grid" class="bonus-grid"></div><p id="bonus-result" class="bonus-result" aria-live="assertive"></p>
  </div></div>

  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-header"><div id="modal-icon" class="modal-icon">🀄</div><p id="modal-kicker" class="modal-kicker"></p><h2 id="modal-title">本局結束</h2></header>
      <div id="modal-body" class="modal-body modal-scroll-content"></div>
      <footer id="modal-actions" class="modal-actions modal-footer"></footer>
    </div>
  </div>
  <script src="game-config.js"></script>
  <script src="game.js"></script>
</body>
</html>
